<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Manual Event Producer</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 6px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 10px 20px; }
        #result { margin-top: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>
<h2>Отправить событие вручную</h2>

<form id="eventForm">
    <label>Event type
        <select name="eventType">
            <option value="view">view</option>
            <option value="cart">cart</option>
            <option value="purchase">purchase</option>
        </select>
    </label>
    <label>Product ID <input name="productId" type="number" value="123456" required></label>
    <label>Category ID <input name="categoryId" type="number" value="2053013552326770905" required></label>
    <label>Category code <input name="categoryCode" placeholder="electronics.smartphone"></label>
    <label>Brand <input name="brand" placeholder="apple"></label>
    <label>Price <input name="price" type="number" step="0.01" value="99.99" required></label>
    <label>User ID <input name="userId" type="number" value="1" required></label>
    <label>User session (опционально) <input name="userSession"></label>
    <button type="submit">Отправить</button>
</form>

<div id="result"></div>

<script>
    // Простой fetch-запрос: собираем данные формы в JSON и шлём на backend,
    // без перезагрузки страницы (без стандартной отправки формы через action/method).
    document.getElementById('eventForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const payload = Object.fromEntries(formData.entries());

        const response = await fetch('/api/events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const text = await response.text();
        document.getElementById('result').textContent = text;
    });
</script>
</body>
</html>
