services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Три листенера: внутренний (для связи между контейнерами в Docker-сети),
      # controller (для KRaft — управление метаданными кластера, замена ZooKeeper),
      # и внешний host-листенер — для подключения с твоей машины (Java-код вне Docker).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      # Адреса, которые брокер сообщает клиентам как "куда реально подключаться".
      # Внутри Docker-сети другие контейнеры видят брокер как kafka:29092,
      # а с хост-машины (твой producer) — как localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Реплика-фактор для системного топика оффсетов. У нас всего 1 брокер,
      # поэтому реплик больше одной быть не может — иначе брокер не запустится.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Произвольный, но валидный ID кластера — обязателен для инициализации KRaft.
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      # Именованный volume — данные Kafka переживут перезапуск контейнера
      # (docker compose stop/start), но исчезнут при docker compose down -v.
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Тут используется внутренний адрес (kafka:29092), так как kafka-ui
      # сам работает внутри Docker-сети, а не на хост-машине.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # Регистрируем Kafka Connect worker как часть кластера "local" —
      # kafka-ui умеет показывать не только топики, но и коннекторы,
      # если явно указать, где искать Connect REST API.
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

    depends_on:
      - kafka
      - kafka-connect

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      # 8123 — HTTP-интерфейс (для запросов через curl/JDBC HTTP-driver,
      # а также веб-интерфейс play UI прямо в браузере)
      - "8123:8123"
      # 9000 — "родной" TCP-протокол ClickHouse (более быстрый,
      # используется нативным JDBC-драйвером и CLI-клиентом clickhouse-client)
      - "9000:9000"
    environment:
      # Дефолтные логин/пароль для простоты пет-проекта.
      # В проде так делать не стоит, но для локальной разработки нормально.
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: streaming_analytics
    volumes:
      # Данные ClickHouse переживут перезапуск контейнера,
      # как и с Kafka - тот же принцип именованного volume.
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      # ClickHouse рекомендует увеличенный лимит на число открытых файлов —
      # стандартный дефолт Docker (1024) слишком мал и может вызвать
      # странные ошибки под нагрузкой.
      nofile:
        soft: 262144
        hard: 262144

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # Дефолтные логин/пароль для простоты — при первом входе
      # Grafana обычно всё равно попросит сменить пароль admin,
      # но можно пропустить этот шаг для локальной разработки.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Разрешаем устанавливать сторонние плагины (понадобится для ClickHouse
      # datasource — он не входит в Grafana "из коробки", в отличие от
      # PostgreSQL/MySQL, и ставится как plugin).
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      # Дашборды и настройки datasource переживут перезапуск контейнера.
      - grafana-data:/var/lib/grafana
    depends_on:
      - clickhouse

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: Developer
      # Developer edition включает SQL Server Agent, который ОБЯЗАТЕЛЕН
      # для работы CDC — это не просто "включить флаг", CDC физически
      # работает через агентские job'ы, читающие transaction log.
      MSSQL_AGENT_ENABLED: "true"

  kafka-connect:
    # Официальный образ Debezium уже включает Kafka Connect worker
    # со всеми Debezium-коннекторами предустановленными — не нужно
    # вручную собирать classpath из отдельных jar'ов, как было бы
    # с "чистым" Kafka Connect образом.
    image: quay.io/debezium/connect:2.7
    container_name: kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect-group
      # Kafka Connect в distributed-режиме хранит своё внутреннее состояние
      # (конфиги коннекторов, offset'ы, статусы) в трёх служебных топиках —
      # аналог __consumer_offsets, но для самого Connect framework'а.
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
    depends_on:
      - kafka
      - sqlserver

volumes:
  kafka-data:
  clickhouse-data:
  grafana-data: